<!-- E3641A card body. Elements are found by data-k, never by id: the same card
     can be on the page twice. -->
<div class="lcd">
  <div class="big"><span data-k="v">--.---</span><span class="u">V</span></div>
  <div class="big" style="font-size:clamp(20px,4.4vw,32px);margin-top:4px">
    <span data-k="i">-.----</span><span class="u">A</span></div>
  <div class="stats"><span>SET <b data-k="vset">--</b> V</span>
    <span>LIMIT <b data-k="iset">--</b> A</span>
    <span>OVP <b data-k="ovp">--</b> V</span></div>
</div>

<div class="sec">
  <h4>Range</h4>
  <div class="row">
    <button data-k="r-LOW">LOW · 35 V / 0.8 A</button>
    <button data-k="r-HIGH">HIGH · 60 V / 0.5 A</button>
  </div>

  <h4>Setpoints</h4>
  <div class="row">
    <label>V</label><input type="number" data-k="in-v" step="0.001" min="0" value="1.000">
    <button data-k="set-v">Set V</button>
    <label>I</label><input type="number" data-k="in-i" step="0.001" min="0" value="0.100">
    <button data-k="set-i">Set I</button>
  </div>

  <h4>Over-voltage protection</h4>
  <div class="row">
    <input type="number" data-k="in-ovp" step="0.1" min="0" value="5.0">
    <button data-k="set-ovp">Set OVP</button>
    <button data-k="ovp-on">OVP on</button>
    <button data-k="ovp-off">OVP off</button>
    <button data-k="ovp-clear">Clear trip</button>
  </div>

  <h4>Output</h4>
  <div class="row">
    <button class="go" data-k="out-on">OUTPUT ON</button>
    <button class="danger" data-k="out-off">OUTPUT OFF</button>
    <button data-k="errors">Read errors</button>
  </div>

  <h4>Saved setups &mdash; the supply always powers up at 0&nbsp;V / OVP 66&nbsp;V</h4>
  <div class="grid" data-k="slots"></div>
  <div class="row" style="margin-top:8px">
    <input type="text" data-k="slotname" maxlength="9" placeholder="name (optional)" style="width:150px">
    <button data-k="save">Save to 1</button>
    <button class="go" data-k="recall">Recall 1</button>
  </div>
</div>
