# Bench Panel -- proxied by Apache (TLS + Basic auth), 2026-09-22
# Include it from your TLS <VirtualHost>, then create the login file:
#   sudo htpasswd -c /etc/httpd/conf/bench.htpasswd <user>
#
# The app itself listens on 127.0.0.1:8765 and is NOT reachable from the LAN.
# Everything arrives through here, which means everything is authenticated.
# This matters more than usual: the panel can switch on a power supply.
<Location /bench>
    AuthType Basic
    AuthName "Bench Panel"
    AuthUserFile /etc/httpd/conf/bench.htpasswd
    Require valid-user

    ProxyPass        http://127.0.0.1:8765
    ProxyPassReverse http://127.0.0.1:8765
</Location>
