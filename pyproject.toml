[build-system]
requires = ["setuptools>=77"]      # the SPDX licence string below (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "benchpanel"
version = "1.6.2"
description = "Stand-alone, plug-in dashboard for bench test instruments (GPIB, LAN, USB)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ernesto Castoza"}]
dependencies = ["pyvisa>=1.13", "pyvisa-py>=0.7"]

[project.optional-dependencies]
# pyvisa-py needs these for USB-TMC instruments and local GPIB cards.
usb = ["pyusb"]
gpib = ["gpib-ctypes"]

[project.scripts]
benchpanel = "benchcore.server:main"

[tool.setuptools]
# benchcore is the name plugins import (`from benchcore.instrument import Instrument`)
# -- it must not change. The repo's top-level static/ and catalog/ are shipped
# INSIDE it; the client is installed as the `benchpanel` package.
packages = ["benchcore", "benchcore.static", "benchcore.catalog", "benchcore.script_catalog", "benchpanel"]

[tool.setuptools.package-dir]
"benchcore.static" = "static"
"benchcore.catalog" = "catalog"
"benchcore.script_catalog" = "examples"
"benchpanel" = "client"

[tool.setuptools.package-data]
"benchcore.static" = ["*.html", "*.js", "*.css"]
"benchcore.catalog" = ["*/*.json", "*/*.py", "*/*.html", "*/*.js", "*/*.md"]
"benchcore.script_catalog" = ["*.py"]
